name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check out Data API documentation sources
        uses: actions/checkout@v4
        with:
          repository: nexscope-ai/ecommerce-ai-tools
          ref: main
          path: .api-docs-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test Data API documentation generation
        run: node --test .api-docs-source/scripts/test_build_api_docs.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test interactive API workflows
        run: npm run test:workflows

      - name: Test public subscription pricing
        run: node --test scripts/test-public-pricing.mjs scripts/test-home-examples.mjs

      - name: Test research tools
        run: npm run test:research

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
